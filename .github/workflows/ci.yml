name: CI

on:
  push:
    branches: [main, recovery/rea-audit]
  pull_request:

jobs:
  static-qa:
    name: Validación estática de addons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validador QA de la suite DOLAN
        run: python scripts/validate_addons.py

      - name: Verificar el orden de arranque de assets DOLAN_theme
        run: python scripts/test_theme_asset_bootstrap.py

      - name: Verificar addons incluidos por perfil de despliegue
        run: python scripts/test_install_profile_addons.py

      - name: Verificar idioma único es_AR del instalador
        run: python scripts/test_installer_locale_es_ar.py

      - name: Compilar todo el código Python (sintaxis)
        run: python -m compileall -q addons scripts

      - name: Validar lock de distribución
        run: python scripts/distribution_lock.py

  security-and-sbom:
    name: Secretos, SBOM y notices
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar secretos en el historial Git
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --exit-code 1 --verbose /repo

      - name: Buscar secretos en el árbol de archivos
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          dir --redact --exit-code 1 --verbose /repo

      - name: Construir imagen para el inventario de dependencias
        run: docker build -t dolan/odoo20-sbom:${{ github.sha }} .

      - name: Construir servicios locales y obtener imágenes de servicios
        run: |
          docker build -t dolan/local-whisper:ci services/local-whisper
          docker build -t dolan/escpos-bridge:ci services/escpos-bridge
          docker pull odoo:20.0@sha256:a97a7665e2b9fd890e12785491a2c91d779f800bcbc30873dada1c8748b28f1c
          docker pull postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
          docker pull devlikeapro/waha:latest@sha256:2fc1787ddbd343ed2e7d59482846d1b22aa5ca134e29aa8d42d0e88c54e24779

      - name: Generar SBOM SPDX de todas las imágenes
        run: |
          set -euo pipefail
          syft_image='anchore/syft:v1.55.0@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a'
          images=(
            'odoo=dolan/odoo20-sbom:${{ github.sha }}'
            'odoo-installer=odoo:20.0@sha256:a97a7665e2b9fd890e12785491a2c91d779f800bcbc30873dada1c8748b28f1c'
            'whisper=dolan/local-whisper:ci'
            'escpos=dolan/escpos-bridge:ci'
            'postgres=postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b'
            'waha=devlikeapro/waha:latest@sha256:2fc1787ddbd343ed2e7d59482846d1b22aa5ca134e29aa8d42d0e88c54e24779'
          )
          for entry in "${images[@]}"; do
            name="${entry%%=*}"
            image="${entry#*=}"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${{ github.workspace }}:/out" \
              "$syft_image" "$image" \
              -o "spdx-json=/out/sbom-${name}.spdx.json"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dolan-sbom-${{ github.sha }}
          path: sbom-*.spdx.json
          if-no-files-found: error
          retention-days: 90

  odoo-tests:
    name: Tests en Odoo CE 20 (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen Odoo CE 20 + dependencias DOLAN
        run: docker build -t dolan/odoo20-ci:20.0 .

      - name: Instalar la suite y ejecutar los tests
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/addons:/opt/odoo/dolan-addons" \
            --entrypoint bash dolan/odoo20-ci:20.0 -c '
              set -euo pipefail
              export PGPASSWORD=odoo
              until pg_isready -h 127.0.0.1 -p 5432 -U odoo -d postgres >/dev/null 2>&1; do sleep 1; done

              ADDONS_PATH="/opt/odoo/odoo-server/odoo/addons,/opt/odoo/odoo-server/addons,/opt/odoo/dolan-addons"
              for dir in /opt/odoo/ingadhoc/*; do
                [ -d "${dir}" ] && ADDONS_PATH="${ADDONS_PATH},${dir}"
              done

              printf "%s\n" "[options]" "admin_passwd = ci" "db_host = 127.0.0.1" "db_port = 5432" "db_user = odoo" "db_password = odoo" "addons_path = ${ADDONS_PATH}" "data_dir = /var/lib/odoo" "workers = 0" "max_cron_threads = 0" "without_demo = True" "log_level = warn" "log_handler = odoo.addons:INFO" > /tmp/odoo.conf

              MODULES="base,web,l10n_ar,l10n_ar_withholding,l10n_ar_pos,l10n_ar_stock,project,project_todo,purchase,purchase_stock,fleet,point_of_sale,pos_restaurant,stock,account,DOLAN_base,DOLAN_theme,DOLAN_l10n_ar_afip,DOLAN_accounting,DOLAN_account_reports,DOLAN_ai,DOLAN_ocr,DOLAN_whatsapp,DOLAN_views,DOLAN_pos,DOLAN_stock_mrp,DOLAN_subscription,DOLAN_renting,DOLAN_knowledge_bi,DOLAN_exchange,DOLAN_marketplace,DOLAN_credit_limit_pos,DOLAN_credit_limit,DOLAN_pricelist,DOLAN_discount_engine,DOLAN_payment_terminal,ePOS_print,pos_scale_management,hr,analytic,DOLAN_hr_core,DOLAN_payroll_ar,DOLAN_personal_operativo,DOLAN_personal,DOLAN_l10n_ar_cot,DOLAN_bank_ar,DOLAN_collections"

              # Instalación + tests en una sola pasada; odoo-bin sale con
              # código != 0 si algún test falla. Limitar la batería a los
              # módulos propios evita atribuir a DOLAN fallos de traducciones
              # o pruebas internas de Odoo Community.
              python3 /opt/odoo/odoo-server/odoo-bin -c /tmp/odoo.conf \
                -d ci_test \
                --without-demo=True \
                -i "${MODULES}" \
                --test-enable \
                --test-tags "/DOLAN_base,/DOLAN_theme,/DOLAN_l10n_ar_afip,/DOLAN_accounting,/DOLAN_account_reports,/DOLAN_ai,/DOLAN_ocr,/DOLAN_whatsapp,/DOLAN_views,/DOLAN_pos,/DOLAN_stock_mrp,/DOLAN_subscription,/DOLAN_renting,/DOLAN_knowledge_bi,/DOLAN_exchange,/DOLAN_marketplace,/DOLAN_credit_limit_pos,/DOLAN_credit_limit,/DOLAN_pricelist,/DOLAN_discount_engine,/DOLAN_payment_terminal,/ePOS_print,/pos_scale_management,/DOLAN_hr_core,/DOLAN_payroll_ar,/DOLAN_l10n_ar_cot,/DOLAN_bank_ar,/DOLAN_collections" \
                --stop-after-init

              # Smoke de upgrade sobre la DB ya instalada: detecta errores de
              # actualización de vistas, modelos y datos sin usar `-u all`.
              python3 /opt/odoo/odoo-server/odoo-bin -c /tmp/odoo.conf \
                -d ci_test \
                --without-demo=True \
                -u "${MODULES}" \
                --stop-after-init
            '
