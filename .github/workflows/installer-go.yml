name: Installer Go

on:
  push:
    paths:
      - 'installer/**'
      - '.github/workflows/installer-go.yml'
  pull_request:
    paths:
      - 'installer/**'
      - '.github/workflows/installer-go.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          check-latest: false
          cache-dependency-path: installer/go.sum
      - run: go test ./...
      - run: go vet ./...
      - name: Validate Bash entry points
        run: bash -n ../bootstrap.sh ../crear_odoo20.sh
      - name: Cross compile supported targets and generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dolan-dist
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [[ "$os" == "windows" ]]; then ext=".exe"; fi
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "/tmp/dolan-dist/dolan-${os}-${arch}${ext}" ./cmd/dolan
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "/tmp/dolan-dist/dolan-installer-${os}-${arch}${ext}" ./cmd/dolan-installer
          done
          (cd /tmp/dolan-dist && sha256sum dolan-* > SHA256SUMS && sha256sum --check SHA256SUMS)
