name: Installer Go

on:
  push:
    paths:
      - 'installer/**'
      - '.github/workflows/installer-go.yml'
  pull_request:
    paths:
      - 'installer/**'
      - '.github/workflows/installer-go.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          check-latest: false
          cache-dependency-path: installer/go.sum
      - run: go test ./...
      - run: go vet ./...
      - name: Validate Bash entry points
        run: bash -n ../bootstrap.sh ../crear_odoo20.sh
      - name: Cross compile supported targets
        shell: bash
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /tmp/dolan-installer-"${target//\//-}" ./cmd/dolan-installer
          done
